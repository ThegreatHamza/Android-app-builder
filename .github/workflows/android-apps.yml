name: Build Android apps

on:
  push:
    branches: ["**"]
    paths: ["apps/**", ".github/workflows/android-apps.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to attach APK/AAB files to a GitHub Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [hifz-path, site-calc]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Signing uses two repository secrets (Settings > Secrets and variables > Actions):
      #   KEYSTORE_BASE64 = base64 of release.jks   (base64 -w0 release.jks)
      #   KS_PASS         = keystore and key password
      # Without them the release build is produced unsigned (fine for CI checks, not installable).
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set - the release APK will be unsigned."
          fi

      - name: Test, lint and build
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease bundleRelease

      - name: Collect outputs
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          for f in app/build/outputs/apk/release/*.apk; do
            suffix=""; case "$f" in *unsigned*) suffix="-unsigned";; esac
            cp "$f" "$GITHUB_WORKSPACE/dist/${{ matrix.app }}-v$V$suffix.apk"
          done
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/dist/${{ matrix.app }}-v$V.aab"
          (cd "$GITHUB_WORKSPACE/dist" && sha256sum ${{ matrix.app }}-* > ${{ matrix.app }}-SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}
          path: dist/*

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
